<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".45" stop-color="#ffc83d"/><stop offset="1" stop-color="#d48600"/></linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#c27a00"/></linearGradient>
    <!-- side notches of a ticket stub -->
    <mask id="notch">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <circle cx="8" cy="32" r="4.5" fill="#000"/>
      <circle cx="56" cy="32" r="4.5" fill="#000"/>
    </mask>
  </defs>
  <!-- back ticket -->
  <g transform="rotate(-22 32 32) translate(-4 -6)">
    <g mask="url(#notch)">
      <rect x="8" y="19" width="48" height="26" rx="4" fill="#7a4300" transform="translate(0 3)"/>
      <rect x="8" y="19" width="48" height="26" rx="4" fill="url(#gold2)" stroke="#8a5200" stroke-width="1.2"/>
    </g>
    <path d="M40 22v20" stroke="#8a5200" stroke-width="1.4" stroke-dasharray="2.5 2"/>
  </g>
  <!-- front ticket -->
  <g transform="rotate(12 32 32) translate(2 8)">
    <g mask="url(#notch)">
      <rect x="8" y="19" width="48" height="26" rx="4" fill="#6b3a00" transform="translate(0 3)"/>
      <rect x="8" y="19" width="48" height="26" rx="4" fill="url(#gold)" stroke="#8a5200" stroke-width="1.2"/>
    </g>
    <path d="M40 22v20" stroke="#8a5200" stroke-width="1.4" stroke-dasharray="2.5 2"/>
    <path d="M25 24.5l2.1 4.3 4.7.7-3.4 3.3.8 4.7-4.2-2.2-4.2 2.2.8-4.7-3.4-3.3 4.7-.7z" fill="#e11d2e" stroke="#7a0b16" stroke-width=".8" stroke-linejoin="round"/>
    <rect x="12" y="21" width="40" height="3" rx="1.5" fill="#fff" opacity=".55"/>
  </g>
</svg>
