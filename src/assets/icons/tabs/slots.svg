<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".35" stop-color="#ffc83d"/><stop offset=".7" stop-color="#e09400"/><stop offset="1" stop-color="#a86200"/></linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#b86f00"/></linearGradient>
    <!-- cylinder shading: dark top/bottom, bright middle -->
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8a98a"/><stop offset=".3" stop-color="#fffaf0"/><stop offset=".7" stop-color="#fffaf0"/><stop offset="1" stop-color="#b8a98a"/></linearGradient>
    <linearGradient id="seven" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#a50f1c"/></linearGradient>
    <radialGradient id="ball" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ff9a9a"/><stop offset=".5" stop-color="#e11d2e"/><stop offset="1" stop-color="#7a0610"/></radialGradient>
    <path id="s7" d="M12 6h40v11L33 55H19l18-36H12z" fill="url(#seven)" stroke="#c77700" stroke-width="4" stroke-linejoin="round"/>
  </defs>

  <!-- lever -->
  <rect x="49" y="35" width="7" height="11" rx="2" fill="url(#goldSide)" stroke="#8a5200" stroke-width="1"/>
  <path d="M54 40L59 15" stroke="#9aa3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M53.3 39.5L58.3 14.5" stroke="#eef1f7" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59" cy="12" r="5" fill="url(#ball)"/>
  <ellipse cx="57.6" cy="10.4" rx="1.8" ry="1.2" fill="#fff" opacity=".8"/>

  <!-- body: extrusion, face, shine -->
  <rect x="3" y="13" width="48" height="46" rx="8" fill="#6b3a00"/>
  <rect x="3" y="9" width="48" height="46" rx="8" fill="url(#gold)" stroke="#8a5200" stroke-width="1.2"/>
  <rect x="7" y="11.5" width="40" height="4" rx="2" fill="#fff" opacity=".55"/>

  <!-- reel window -->
  <rect x="7" y="18" width="40" height="28" rx="4" fill="#3b1d00" stroke="#8a5200" stroke-width="1"/>
  <rect x="9" y="20" width="11" height="24" rx="2" fill="url(#reel)"/>
  <rect x="21.5" y="20" width="11" height="24" rx="2" fill="url(#reel)"/>
  <rect x="34" y="20" width="11" height="24" rx="2" fill="url(#reel)"/>

  <!-- 7 on each reel -->
  <use href="#s7" transform="translate(8.1 26.4) scale(.2)"/>
  <use href="#s7" transform="translate(20.6 26.4) scale(.2)"/>
  <use href="#s7" transform="translate(33.1 26.4) scale(.2)"/>

  <!-- glass glare over the reels -->
  <path d="M9 20h36v6C33 23 21 23 9 26z" fill="#fff" opacity=".35"/>

  <!-- coin tray -->
  <rect x="11" y="48.5" width="32" height="3.5" rx="1.75" fill="#7a4300"/>
</svg>
