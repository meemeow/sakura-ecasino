<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="66" viewBox="0 0 640 66">
  <!-- Cherry tree for the navbar: trunk rising at the right edge, limbs spreading left under a
       hazy canopy of soft blossoms. -->
  <defs>
    <radialGradient id="petal" cx="0" cy="0" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f06292"/>
      <stop offset=".28" stop-color="#f8a9c4"/>
      <stop offset=".62" stop-color="#ffd9e6"/>
      <stop offset="1" stop-color="#fff4f8"/>
    </radialGradient>
    <radialGradient id="bud" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffd0e0"/>
      <stop offset="1" stop-color="#ec6f9b"/>
    </radialGradient>
    <linearGradient id="loose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0f5"/>
      <stop offset="1" stop-color="#f8a9c4"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a1f2a"/>
      <stop offset=".5" stop-color="#8a3442"/>
      <stop offset="1" stop-color="#4a1822"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>

    <path id="pt" d="M0 0C-6-2.4-7.4-9-4-12.2C-2.4-13-1-12.4 0-11C1-12.4 2.4-13 4-12.2C7.4-9 6-2.4 0 0Z"/>
    <g id="flower">
      <g fill="url(#petal)" stroke="#f7b8cd" stroke-width=".3">
        <use href="#pt" xlink:href="#pt"/>
        <use href="#pt" xlink:href="#pt" transform="rotate(72)"/>
        <use href="#pt" xlink:href="#pt" transform="rotate(144)"/>
        <use href="#pt" xlink:href="#pt" transform="rotate(216)"/>
        <use href="#pt" xlink:href="#pt" transform="rotate(288)"/>
      </g>
      <path d="M0 0L0-4.6M0 0L4.2-2M0 0L2.8 3.8M0 0L-2.8 3.8M0 0L-4.2-2" stroke="#c2185b" stroke-width=".5" stroke-linecap="round"/>
      <g fill="#a8324a">
        <circle cy="-4.8" r=".75"/><circle cx="4.4" cy="-2.1" r=".75"/><circle cx="2.9" cy="4" r=".75"/>
        <circle cx="-2.9" cy="4" r=".75"/><circle cx="-4.4" cy="-2.1" r=".75"/>
      </g>
      <circle r="1.3" fill="#d81b60"/>
    </g>
    <g id="budg">
      <ellipse rx="2.8" ry="4" fill="url(#bud)"/>
      <path d="M-2.2 2.4C-1.2 4.2 1.2 4.2 2.2 2.4" fill="none" stroke="#7d2a35" stroke-width=".9"/>
    </g>
    <path id="lp" d="M0-4C3-4 4.4-1 3.4 2C2.4 4.6-1 5-2.6 2.6C-4 0.4-3-4 0-4Z" fill="url(#loose)"/>
  </defs>

